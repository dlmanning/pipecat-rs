[package]
name = "pipecat-examples"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "transcribe"
path = "foundational/transcribe.rs"

[[bin]]
name = "listen-and-respond"
path = "foundational/listen-and-respond.rs"

[dependencies]
pipecat-core = { workspace = true }
pipecat-pipeline = { workspace = true }
pipecat-transport = { workspace = true, features = ["cpal"] }
pipecat-audio = { workspace = true, features = ["silero"] }
pipecat-context = { workspace = true }
pipecat-services = { workspace = true, features = ["whisper"] }
pipecat-turns = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
whisper-rs = { workspace = true }
