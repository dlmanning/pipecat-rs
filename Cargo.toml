[workspace]
members = [
    "crates/pipecat-core",
    "crates/pipecat-pipeline",
    "crates/pipecat-transport",
    "crates/pipecat-audio",
    "crates/pipecat-turns",
    "crates/pipecat-context",
    "crates/pipecat-services",
    "crates/pipecat-integration-tests",
    "examples",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
repository = "https://github.com/pipecat-ai/pipecat-rs"

[workspace.dependencies]
# Internal crates
pipecat-core = { path = "crates/pipecat-core" }
pipecat-pipeline = { path = "crates/pipecat-pipeline" }
pipecat-transport = { path = "crates/pipecat-transport" }
pipecat-audio = { path = "crates/pipecat-audio" }
pipecat-turns = { path = "crates/pipecat-turns" }
pipecat-context = { path = "crates/pipecat-context" }
pipecat-services = { path = "crates/pipecat-services" }

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Data
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Networking
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "stream"] }

# Audio
hound = "3.5"

# Encoding
base64 = "0.22"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Crypto (for AWS Sig V4)
hmac = "0.12"
sha2 = "0.10"

# Checksums
crc32fast = "1"

# ML inference
ort = { version = "2.0.0-rc.12", default-features = false, features = ["ndarray"] }
ndarray = "0.17"
whisper-rs = "0.16"

# Utilities
thiserror = "2"
url = "2"
