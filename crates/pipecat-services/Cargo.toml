[package]
name = "pipecat-services"
version.workspace = true
edition.workspace = true

[dependencies]
pipecat-core = { workspace = true }
pipecat-audio = { workspace = true }
pipecat-context = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
url = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
crc32fast = { workspace = true, optional = true }
whisper-rs = { workspace = true, optional = true }

[dev-dependencies]
pipecat-core = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
deepgram = ["dep:tokio-tungstenite", "dep:url"]
elevenlabs = ["dep:tokio-tungstenite", "dep:base64", "dep:url"]
openai = ["dep:reqwest", "dep:tokio-tungstenite", "dep:base64", "dep:image"]
azure = ["dep:tokio-tungstenite", "dep:reqwest", "dep:url"]
aws = ["dep:tokio-tungstenite", "dep:hmac", "dep:sha2", "dep:url", "dep:crc32fast"]
claude-code = []
whisper = ["dep:whisper-rs"]
