[package]
name = "pipecat-integration-tests"
version.workspace = true
edition.workspace = true

[features]
default = []
silero = ["pipecat-audio/silero"]
whisper = ["pipecat-services/whisper", "dep:whisper-rs"]

[dependencies]
pipecat-core = { workspace = true, features = ["test-utils"] }
pipecat-pipeline = { workspace = true }
pipecat-services = { workspace = true }
pipecat-context = { workspace = true }
pipecat-turns = { workspace = true }
pipecat-transport = { workspace = true }
pipecat-audio = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
hound = { workspace = true }
whisper-rs = { workspace = true, optional = true }
